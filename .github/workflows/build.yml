name: Build

# Additional tests to check if our project builds on Windows and macOS
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake downloads GLFW and GLM)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Collect Windows package
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir package
          cp solar.exe README.md package/
          cp -R shaders textures package/

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SolarSystem-windows
          path: package

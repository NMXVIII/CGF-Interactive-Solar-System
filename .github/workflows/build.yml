name: Build

# Builds the project on Windows, macOS and Linux for every push, and publishes a ready
# Windows package (solar.exe + shaders + textures) as a downloadable artifact.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages for GLFW
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xorg-dev libgl1-dev

      - name: Configure (CMake downloads GLFW and GLM)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Collect Windows package
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir package
          cp solar.exe README.md package/
          cp -R shaders textures package/

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SolarSystem-windows
          path: package
